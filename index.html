<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行业比较 DashBoard</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#f3f5f9; --sidebar-bg:#fff; --card-bg:#fff; --border:#e5e8ef; --text-main:#1f2430; --text-sub:#6b7280; --text-faint:#9ca3af; --accent:#2563eb; --accent-light:#eff4ff; --red:#dc2626; --green:#16a34a; --orange:#d97706; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04); }
html,body{height:100%;}
body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:var(--bg);color:var(--text-main);font-size:14px;}
#loading{display:flex;align-items:center;justify-content:center;height:100vh;font-size:16px;color:var(--text-sub);flex-direction:column;gap:16px;}
#loading .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#app{display:flex;height:100vh;overflow:hidden;}
#sidebar{width:216px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.logo{padding:20px 20px 16px;border-bottom:1px solid var(--border);}
.logo-title{font-size:18px;font-weight:700;letter-spacing:1px;}
.logo-sub{font-size:12px;color:var(--text-faint);letter-spacing:2px;margin-top:2px;}
#nav{flex:1;overflow-y:auto;padding:10px 0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;cursor:pointer;user-select:none;color:var(--text-sub);border-left:3px solid transparent;transition:background .12s,color .12s;}
.nav-item:hover{background:#f6f8fc;color:var(--text-main);}
.nav-item.active{background:var(--accent-light);color:var(--accent);border-left-color:var(--accent);font-weight:600;}
.nav-icon{width:18px;text-align:center;font-size:15px;}
.nav-badge{margin-left:auto;font-size:11px;color:var(--text-faint);background:#f1f3f8;border-radius:8px;padding:1px 7px;}
.nav-item.active .nav-badge{background:#dbe7ff;color:var(--accent);}
.sidebar-footer{padding:12px 20px;font-size:11px;color:var(--text-faint);border-top:1px solid var(--border);line-height:1.6;}
.nav-sub-item{display:flex;align-items:center;gap:8px;padding:9px 20px 9px 47px;cursor:pointer;user-select:none;font-size:13px;color:var(--text-sub);border-left:3px solid transparent;}
.nav-sub-item::before{content:'';width:5px;height:5px;border-radius:50%;background:#c3c9d4;flex-shrink:0;}
.nav-sub-item:hover{background:#f6f8fc;color:var(--text-main);}
.nav-sub-item.active{background:var(--accent-light);color:var(--accent);border-left-color:var(--accent);font-weight:600;}
.nav-sub-item.active::before{background:var(--accent);}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#topbar{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--sidebar-bg);border-bottom:1px solid var(--border);flex-shrink:0;}
#module-title{font-size:17px;font-weight:700;}
#topbar-sub{font-size:12px;color:var(--text-faint);}
#health-panel{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;}
.health-chip{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-sub);background:#f6f8fc;border:1px solid var(--border);border-radius:12px;padding:3px 10px;}
.health-dot{width:7px;height:7px;border-radius:50%;}
.health-dot.ok{background:var(--green);}.health-dot.stale{background:var(--orange);}.health-dot.pending{background:#c3c9d4;}
#content{flex:1;overflow-y:auto;padding:20px 24px 32px;}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.toolbar-label{font-size:12px;color:var(--text-faint);}
.range-btn,.cat-btn{font-size:12px;padding:4px 12px;border-radius:14px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text-sub);}
.range-btn.active,.cat-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.chart-search{margin-left:12px;display:inline-flex;align-items:center;gap:8px;}
#chart-search-input{width:240px;font-size:12px;padding:5px 12px;border:1px solid var(--border);border-radius:14px;outline:none;background:#fff;}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
.card.wide{grid-column:1/-1;}
.card-header{display:flex;align-items:baseline;gap:10px;padding:13px 16px 0;flex-wrap:wrap;}
.card-title{font-size:14px;font-weight:600;}
.card-unit{font-size:11px;color:var(--text-faint);}
.card-date{margin-left:auto;font-size:11px;color:var(--text-faint);}
.card-body{height:320px;padding:4px 6px 6px;position:relative;}
.card-note{padding:0 16px 10px;font-size:11px;color:var(--text-faint);line-height:1.5;}
.section-title{grid-column:1/-1;font-size:15px;font-weight:700;margin:6px 0 0;padding:2px 0 2px 10px;border-left:3px solid var(--accent);}
.empty{background:var(--card-bg);border:1px dashed var(--border);border-radius:10px;padding:70px 30px;text-align:center;}
.ov-table-wrap{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow:auto;max-height:78vh;}
#ov-table{border-collapse:collapse;width:100%;font-size:12px;}
#ov-table th{position:sticky;top:0;background:#f6f8fc;color:var(--text-sub);font-weight:600;padding:8px 10px;text-align:right;cursor:pointer;border-bottom:1px solid var(--border);white-space:nowrap;z-index:2;}
#ov-table td{padding:6px 10px;text-align:right;border-bottom:1px solid #f1f3f8;white-space:nowrap;font-variant-numeric:tabular-nums;}
#ov-table tr:hover td{background:#f6f8fc;}
.pos{color:var(--red);}.neg{color:var(--green);}
.snap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:16px;}
.snap-card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px;}
.roll-select{font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text-sub);outline:none;cursor:pointer;}
.info-btn{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;font-size:10px;font-weight:700;color:#fff;background:#b6bdca;cursor:pointer;flex-shrink:0;opacity:0;}
.card:hover .info-btn{opacity:1;}
@media (max-width:1100px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div>正在加载数据...</div></div>
<div id="app" style="display:none;">
  <aside id="sidebar">
    <div class="logo"><div class="logo-title">行业比较</div><div class="logo-sub">DashBoard</div></div>
    <nav id="nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer"></div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div><div id="module-title"></div><div id="topbar-sub"></div></div>
      <div id="health-panel"></div>
    </header>
    <section id="content"></section>
  </main>
</div>
<script src="echarts.min.js"></script>
<script src="app.js"></script>
<script>
(async function() {
  const modules = ['meta','valuation','earnings','sentiment','macro_cn','liquidity','macro_global','scoring','hf_macro','ai_pressure'];
  const DASH = {};
  const ts = Date.now();
  const results = await Promise.allSettled(
    modules.map(m => fetch(`data/${m}.json?t=${ts}`).then(r => r.ok ? r.json() : Promise.reject(m)))
  );
  let loaded = 0;
  results.forEach((r, i) => {
    if (r.status === 'fulfilled') { DASH[modules[i]] = r.value; loaded++; }
    else console.warn(`Failed to load ${modules[i]}`);
  });
  window.DASH = DASH;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  window.dispatchEvent(new Event('dash-ready'));
})();
</script>
</body>
</html>
